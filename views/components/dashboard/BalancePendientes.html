<div class="bg-[#0b132b] border border-slate-800 rounded-lg p-4 space-y-4">
  <div class="flex items-center justify-between border-b border-slate-800 pb-3">
    <h2 class="text-base font-semibold text-white flex items-center gap-2">
      <span>📊 Balance y Pendientes</span>
    </h2>
    <span class="text-xs text-cyan-400 font-mono" x-text="`Lote Activo: ${loteActivo || 'N/A'}`"></span>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-slate-900/60 p-3 rounded border border-slate-800">
      <span class="text-xs text-slate-400">Total Movimiento Filtrado</span>
      <div class="text-xl font-bold text-cyan-400 font-mono mt-1" x-text="movimientoFiltradoTotal"></div>
    </div>
    <div class="bg-slate-900/60 p-3 rounded border border-slate-800">
      <span class="text-xs text-slate-400">Socios Registrados</span>
      <div class="text-xl font-bold text-white font-mono mt-1" x-text="directorio.length"></div>
    </div>
    <div class="bg-slate-900/60 p-3 rounded border border-slate-800">
      <span class="text-xs text-slate-400">Comprobantes Registrados</span>
      <div class="text-xl font-bold text-emerald-400 font-mono mt-1" x-text="comprobantes.length"></div>
    </div>
  </div>
</div>
