<div class="bg-[#0b132b] border border-slate-800 rounded-lg p-4 space-y-4">
  <div class="flex items-center justify-between border-b border-slate-800 pb-3">
    <h2 class="text-base font-semibold text-white">🔍 Inspección de Lotes</h2>
  </div>
  <p class="text-xs text-slate-400">Inspecciona y monitorea los saldos pendientes por socio y lote.</p>
  <div class="overflow-x-auto">
    <table class="w-full text-left text-xs">
      <thead class="bg-slate-900/80 text-slate-400 font-mono">
        <tr>
          <th class="p-2">Socio</th>
          <th class="p-2">Pendiente</th>
          <th class="p-2">Acción</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-800/50">
        <template x-for="item in sociosPendientesConsolidado" :key="item.id || item.socio">
          <tr class="hover:bg-slate-800/30">
            <td class="p-2 text-white font-medium" x-text="item.socio"></td>
            <td class="p-2 text-cyan-400 font-mono" x-text="item.monto || '0.00'"></td>
            <td class="p-2">
              <button @click="filtroSocio = item.socio; vistaActiva = 'comprobantes'" class="px-2 py-1 bg-cyan-500/20 text-cyan-300 rounded hover:bg-cyan-500/30">Ver Comprobantes</button>
            </td>
          </tr>
        </template>
        <template x-if="!sociosPendientesConsolidado || sociosPendientesConsolidado.length === 0">
          <tr>
            <td colspan="3" class="p-4 text-center text-slate-500">No hay pendientes registrados en este período.</td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
