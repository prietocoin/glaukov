<div class="space-y-4">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
    <div>
      <h2 class="text-xl md:text-2xl font-black text-white tracking-tight">Gestión Unificada de Tasas</h2>
    </div>
    
    <div class="flex items-center gap-2.5 flex-wrap w-full sm:w-auto">
      <div class="flex items-center gap-2 bg-[#060c24] px-3 py-1.5 rounded-xl border border-cyan-500/40 shadow-md">
        <span class="text-xs font-bold text-cyan-300">🧪 Modo Prueba:</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" x-model="modoPruebaActivo" class="sr-only peer">
          <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500"></div>
        </label>
      </div>

      <button @click="reenviarTasaActual()" class="flex-1 sm:flex-none px-3 py-2 bg-amber-950/80 border border-amber-500/50 text-amber-300 rounded-xl text-xs font-bold hover:bg-amber-900 transition-all flex items-center justify-center gap-1 active:scale-95">
        ⚡ Reenviar Tasa
      </button>
      <button @click="conectarHooAPI()" class="flex-1 sm:flex-none px-3 py-2 bg-purple-950/80 border border-purple-500/50 text-purple-300 rounded-xl text-xs font-bold hover:bg-purple-900 transition-all flex items-center justify-center gap-1 active:scale-95">
        🔄 Traer Borrador Hoo
      </button>
    </div>
  </div>

  <div class="bg-[#060c24] rounded-2xl border border-blue-900/60 p-3 md:p-4 space-y-4 shadow-2xl">
    <div class="flex justify-between items-center border-b border-blue-900/50 pb-2">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <h3 class="text-[10px] md:text-xs font-black text-emerald-400 uppercase tracking-wider">Monitor de Variación & Publicación</h3>
      </div>
      <div class="flex items-center gap-2">
        <span x-show="modoPruebaActivo" class="px-2 py-0.5 bg-cyan-950/90 border border-cyan-400/80 text-cyan-300 text-[10px] font-bold rounded-lg font-mono animate-pulse">
          🧪 DESTINO: GRUPO PRUEBA
        </span>
        <span class="px-2 py-0.5 bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 text-[10px] md:text-[11px] font-mono font-bold rounded-lg" x-text="'Lote en Prod: ' + (loteActivo || 'CARGANDO...')"></span>
      </div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
      <template x-for="moneda in Object.keys(tasasProduccion).filter(m => !['ID', 'CREATED_AT', 'SUCCESS', 'MESSAGE'].includes(m.toUpperCase())).sort((a, b) => {
          const bases = ['USD', 'USDT', 'PYUSD', 'ECU', 'PAN'];
          return (bases.includes(a.toUpperCase()) ? 1 : 0) - (bases.includes(b.toUpperCase()) ? 1 : 0);
      })" :key="'card-'+moneda">
          
        <div class="bg-[#030611] p-3 rounded-xl border transition-all relative overflow-hidden"
             :class="(borradorCapturado && borradorCapturado[moneda] !== undefined && parseFloat(borradorCapturado[moneda]) !== parseFloat(tasasProduccion[moneda])) ? 'border-amber-500/60 shadow-[0_0_10px_rgba(245,158,11,0.15)]' : 'border-blue-900/50'">
          
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-black text-purple-400 uppercase font-mono" x-text="moneda"></span>
            <span x-show="borradorCapturado && borradorCapturado[moneda] !== undefined && parseFloat(borradorCapturado[moneda]) !== parseFloat(tasasProduccion[moneda])" 
                  class="flex h-2 w-2 rounded-full bg-amber-400 animate-pulse" title="Cambio detectado"></span>
          </div>
          
          <div class="space-y-2.5">
            <div class="flex items-center justify-between text-[10px] bg-[#060c24] px-1.5 py-1 rounded border border-blue-900/40">
              <span class="text-slate-500 font-bold uppercase">PROD:</span>
              <span class="font-mono font-bold text-slate-300" x-text="formatMonto(tasasProduccion[moneda])"></span>
            </div>
            
            <div class="relative">
              <span class="absolute -top-2 left-2 bg-[#030611] px-1 text-[8px] font-bold text-emerald-400 uppercase">NUEVO LOTE</span>
              <input type="number" step="any" 
                     :value="(borradorCapturado && borradorCapturado[moneda] !== undefined) ? borradorCapturado[moneda] : tasasProduccion[moneda]" 
                     @input="if (!borradorCapturado) borradorCapturado = {}; borradorCapturado[moneda] = $event.target.value"
                     class="w-full bg-[#080e26] border rounded-lg px-2 py-1.5 text-sm font-black font-mono outline-none focus:border-cyan-400 transition-colors"
                     :class="(borradorCapturado && borradorCapturado[moneda] !== undefined && parseFloat(borradorCapturado[moneda]) !== parseFloat(tasasProduccion[moneda])) ? 'text-amber-400 border-amber-900/60' : 'text-emerald-400 border-emerald-900/60'">
            </div>
          </div>

        </div>
      </template>
    </div>

    <div class="flex justify-end pt-3 border-t border-blue-900/50">
      <button @click="publicarTasaOficial()" class="w-full sm:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs md:text-sm rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 active:scale-95">
        🚀 Guardar en tasas_mercado & Publicar
      </button>
    </div>
  </div>
</div>
