<!-- ================================================================= -->
<!-- ARCHIVO: Sidebar.html                                             -->
<!-- UBICACIÓN: views/components/layout/                               -->
<!-- RESPONSABILIDAD: Menú lateral con Dashboard al final             -->
<!-- ================================================================= -->

<aside class="w-full md:w-64 bg-[#050b1e] border-b md:border-b-0 md:border-r border-[#16224f] p-3 md:p-4 flex flex-col justify-between shrink-0 shadow-2xl sticky top-0 z-40">
  <div>
    <div class="flex items-center justify-between md:justify-start gap-3 px-1 py-1.5 md:py-3 mb-2 md:mb-6 border-b border-blue-900/40 md:border-blue-900/50">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 md:w-10 md:h-10 rounded-xl border border-cyan-500/50 bg-[#091333] p-1 flex items-center justify-center shadow-lg shadow-cyan-500/20 shrink-0">
          <img src="/logo-fundablock.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/40?text=FB'">
        </div>
        <div>
          <h1 class="font-black text-white text-sm md:text-base tracking-wider flex items-center gap-1 leading-none">
            FUNDABLOCK
          </h1>
          <p class="text-[9px] md:text-[10px] text-cyan-400 font-bold uppercase tracking-widest mt-0.5">GLAUKOV ENGINE</p>
        </div>
      </div>
      
      <div class="md:hidden flex items-center gap-1.5 text-[10px] text-slate-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <strong class="text-cyan-400 font-extrabold">JAIRO</strong>
      </div>
    </div>

    <nav class="flex md:flex-col gap-1.5 overflow-x-auto pb-1 md:pb-0 scrollbar-none">
      <!-- 1. COMPROBANTES (PRINCIPAL) -->
      <button @click="vistaActiva = 'comprobantes'" 
              :class="vistaActiva === 'comprobantes' ? 'bg-blue-600/30 text-cyan-300 border border-cyan-500/50 shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:bg-blue-950/40 hover:text-white border border-transparent'" 
              class="shrink-0 flex items-center gap-2 px-3 py-2 md:py-2.5 rounded-xl font-bold text-xs transition-all">
        📄 Comprobantes
      </button>

      <!-- 2. TASAS -->
      <button @click="vistaActiva = 'cartelera'" 
              :class="vistaActiva === 'cartelera' ? 'bg-blue-600/30 text-cyan-300 border border-cyan-500/50 shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:bg-blue-950/40 hover:text-white border border-transparent'" 
              class="shrink-0 flex items-center gap-2 px-3 py-2 md:py-2.5 rounded-xl font-bold text-xs transition-all">
        💲 Tasas
      </button>

      <!-- 3. DIRECTORIO -->
      <button @click="vistaActiva = 'directorio'" 
              :class="vistaActiva === 'directorio' ? 'bg-blue-600/30 text-cyan-300 border border-cyan-500/50 shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:bg-blue-950/40 hover:text-white border border-transparent'" 
              class="shrink-0 flex items-center gap-2 px-3 py-2 md:py-2.5 rounded-xl font-bold text-xs transition-all">
        👥 Directorio
      </button>

      <!-- 4. DASHBOARD (AL FINAL DE LA LISTA) -->
      <button @click="vistaActiva = 'dashboard'" 
              :class="vistaActiva === 'dashboard' ? 'bg-blue-600/30 text-cyan-300 border border-cyan-500/50 shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:bg-blue-950/40 hover:text-white border border-transparent'" 
              class="shrink-0 flex items-center gap-2 px-3 py-2 md:py-2.5 rounded-xl font-bold text-xs transition-all">
        📊 Dashboard
      </button>
    </nav>
  </div>

  <div class="hidden md:flex pt-4 border-t border-blue-900/40 text-[11px] text-slate-400 justify-between items-center">
    <span>Instancia: <strong class="text-cyan-400 font-extrabold">JAIRO</strong></span>
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shadow-lg shadow-emerald-400/50"></span>
  </div>
</aside>
