<div class="flex items-center justify-between gap-2">
  <div>
    <h2 class="text-lg md:text-2xl font-black text-white tracking-tight leading-tight">Auditoría en Vivo</h2>
    <p class="text-[10px] md:text-xs text-slate-400">Comprobantes procesados con IA y tasas dinámicas.</p>
  </div>
  <div class="flex items-center gap-1.5 shrink-0">
    <button @click="cargarComprobantes(false)" class="p-2 bg-[#060c24] border border-blue-900/60 rounded-xl hover:bg-blue-900/40 text-slate-300 transition-colors active:scale-95" title="Refrescar">
      🔄
    </button>
    <button @click.stop="$dispatch('abrir-reporte')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center gap-1.5 active:scale-95">
      📄 Reportes
    </button>
    <span class="px-2.5 py-1.5 bg-purple-950/80 border border-purple-500/40 text-purple-300 rounded-xl text-[11px] md:text-xs font-bold font-mono" x-text="comprobantes.length + ' ítems'"></span>
  </div>
</div>

<!-- KPIs SUPERIORES -->
<div class="grid grid-cols-2 lg:grid-cols-5 gap-2 md:gap-3">
  <div class="col-span-2 sm:col-span-1 bg-[#060c24] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-blue-900/50 shadow-xl">
    <p class="text-[8px] md:text-[9px] font-extrabold text-blue-400/80 uppercase">SUJETO / ENTIDAD AUDITADA</p>
    <h3 class="text-xs md:text-base font-black text-white mt-0.5 truncate" x-text="sujetoAuditado"></h3>
  </div>
  <div class="bg-[#060c24] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-blue-900/50 shadow-xl">
    <p class="text-[8px] md:text-[9px] font-extrabold text-blue-400/80 uppercase">OPERADOS</p>
    <h3 class="text-xs md:text-base font-black text-pink-400 mt-0.5" x-text="comprobantes.length + ' ítems'"></h3>
  </div>
  <div class="bg-[#060c24] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-amber-500/30 shadow-xl flex items-center gap-1.5">
    <div class="flex-1 min-w-0">
      <p class="text-[8px] md:text-[9px] font-extrabold text-amber-400 uppercase truncate">SALDO ANTERIOR</p>
      <input type="number" x-model="saldoAnterior" class="w-full bg-[#030611] border border-amber-500/40 rounded-lg px-1.5 py-0.5 text-xs md:text-sm font-bold text-amber-300 mt-0.5 outline-none">
    </div>
    <span class="text-[10px] font-bold text-amber-500 mt-3 shrink-0" x-text="(directorio.find(d => (d.nombre || '').trim().toUpperCase() === (filtroSocio || sujetoAuditado || '').trim().toUpperCase())?.moneda_base || comprobantes[0]?.moneda_socio_1 || 'USDT').toUpperCase()"></span>
  </div>
  <div class="bg-[#060c24] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-blue-900/50 shadow-xl col-span-1">
    <p class="text-[8px] md:text-[9px] font-extrabold text-emerald-400 uppercase">MOVIMIENTO</p>
    <h3 class="text-xs md:text-base font-black text-emerald-400 mt-0.5 truncate" x-text="formatMonto(movimientoFiltradoTotal) + ' ' + (directorio.find(d => (d.nombre || '').trim().toUpperCase() === (filtroSocio || sujetoAuditado || '').trim().toUpperCase())?.moneda_base || comprobantes[0]?.moneda_socio_1 || 'USDT').toUpperCase()"></h3>
  </div>
  <div class="bg-[#010a14] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-emerald-500/40 shadow-xl col-span-2 sm:col-span-1">
    <p class="text-[8px] md:text-[9px] font-extrabold text-emerald-400 uppercase">SALDO ACTUAL TOTAL</p>
    <h3 class="text-xs md:text-base font-black text-emerald-300 mt-0.5 truncate" x-text="formatMonto(saldoActualTotal) + ' ' + (directorio.find(d => (d.nombre || '').trim().toUpperCase() === (filtroSocio || sujetoAuditado || '').trim().toUpperCase())?.moneda_base || comprobantes[0]?.moneda_socio_1 || 'USDT').toUpperCase()"></h3>
  </div>
</div>

<!-- BARRA DE FILTROS -->
<div x-data="{ filtrosAbiertos: false }" class="bg-[#060c24] rounded-2xl border border-blue-900/50 shadow-xl overflow-hidden">
  <button @click="filtrosAbiertos = !filtrosAbiertos" class="w-full md:hidden flex items-center justify-between p-3 bg-[#080e26] text-xs font-bold text-cyan-300">
    <span class="flex items-center gap-2">🔍 Filtros de Auditoría</span>
    <span x-text="filtrosAbiertos ? '▲' : '▼'"></span>
  </button>

  <div :class="filtrosAbiertos ? 'block' : 'hidden md:grid'" class="p-3 grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-2.5 items-end">
    <div>
      <label class="block text-[9px] font-bold text-cyan-400 uppercase mb-1">1. ROL</label>
      <select x-model="filtroRol" @change="cargarComprobantes()" class="w-full bg-[#030611] border border-blue-900/60 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-cyan-400">
        <option value="">Todos los Roles</option>
        <option value="SOCIO">SOCIOS</option>
        <option value="MATRIZ_GENERAL">MATRIZ_GENERAL</option>
        <option value="MATRIZ_1">MATRIZ_1</option>
      </select>
    </div>

    <div>
      <label class="block text-[9px] font-bold text-cyan-400 uppercase mb-1">2. SOCIO / ENTIDAD</label>
      <select x-model="filtroSocio" @change="actualizarSocioSeleccionado()" class="w-full bg-[#030611] border border-blue-900/60 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-cyan-400">
        <option value="">Todos los Socios</option>
        <template x-for="s in directorio" :key="'filtro-socio-' + s.nombre">
          <option :value="s.nombre" x-text="s.nombre"></option>
        </template>
      </select>
    </div>

    <div>
      <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">3. FECHA INICIO</label>
      <input type="date" x-model="filtroFechaInicio" @change="cargarComprobantes()" class="w-full bg-[#030611] border border-blue-900/60 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-cyan-400">
    </div>

    <div>
      <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">4. FECHA FIN</label>
      <input type="date" x-model="filtroFechaFin" @change="cargarComprobantes()" class="w-full bg-[#030611] border border-blue-900/60 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-cyan-400">
    </div>

    <div>
      <label class="block text-[9px] font-bold text-amber-400 uppercase mb-1">5. DESDE HASH</label>
      <select x-model="filtroDesdeHash" @change="cargarComprobantes()" class="w-full bg-[#030611] border border-amber-500/40 rounded-lg px-2 py-1.5 text-xs text-amber-200 outline-none focus:border-amber-400">
        <option value="">TODOS</option>
        <template x-for="item in comprobantes" :key="'desde'+item.hash_largo">
          <option :value="item.hash_largo" x-text="item.hash_corto || (item.hash_largo ? item.hash_largo.substring(0,8) : 'HASH')"></option>
        </template>
      </select>
    </div>

    <div>
      <label class="block text-[9px] font-bold text-amber-400 uppercase mb-1">6. HASTA HASH</label>
      <select x-model="filtroHastaHash" @change="cargarComprobantes()" class="w-full bg-[#030611] border border-amber-500/40 rounded-lg px-2 py-1.5 text-xs text-amber-200 outline-none focus:border-amber-400">
        <option value="">TODOS</option>
        <template x-for="item in comprobantes" :key="'hasta'+item.hash_largo">
          <option :value="item.hash_largo" x-text="item.hash_corto || (item.hash_largo ? item.hash_largo.substring(0,8) : 'HASH')"></option>
        </template>
      </select>
    </div>

    <div>
      <label class="block text-[9px] font-bold text-cyan-400 uppercase mb-1">7. ORDENAR</label>
      <select x-model="ordenarPor" @change="cargarComprobantes()" class="w-full bg-[#030611] border border-blue-900/60 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-cyan-400">
        <option value="fecha_desc">Recientes primero</option>
        <option value="fecha_asc">Antiguos primero</option>
        <option value="monto_desc">Monto: Mayor a menor</option>
        <option value="monto_asc">Monto: Menor a mayor</option>
      </select>
    </div>

    <div class="col-span-2 md:col-span-1">
      <label class="block text-[9px] font-bold text-cyan-400 uppercase mb-1">BUSCAR HASH</label>
      <input type="text" x-model="filtroHashBusqueda" @keyup.enter="cargarComprobantes()" placeholder="Buscar..." class="w-full bg-[#030611] border border-blue-900/60 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-cyan-400">
    </div>
  </div>
</div>

<!-- GRILLA DE CARDS DE COMPROBANTES CON PROPORCIÓN CORREGIDA -->
<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-3 md:gap-5">
  <template x-for="item in comprobantes" :key="item.hash_largo">
    <div class="bg-[#060c24] border border-[#16224f] hover:border-cyan-500/40 rounded-2xl p-3 md:p-4 shadow-xl flex flex-col justify-between gap-2.5 transition-all relative">
      
      <div class="flex items-start justify-between gap-2 border-b border-blue-900/30 pb-2">
        <div class="flex items-baseline gap-1 min-w-0">
          <span class="text-xl sm:text-2xl font-black tracking-tight truncate" 
                :class="parseFloat(item.monto || item.monto_local) < 0 ? 'text-rose-400' : 'text-emerald-400'" 
                x-text="formatMonto(item.monto || item.monto_local)"></span>
          <span class="text-xs font-black text-slate-300 whitespace-nowrap" 
                x-text="item.moneda || item.moneda_local || 'PEN'"></span>
        </div>
        <div class="flex flex-col items-end text-right text-[9px] md:text-[10px] font-mono leading-tight max-w-[130px] shrink-0">
          <span class="text-slate-200 font-bold uppercase truncate w-full" x-text="item.titular || 'TITULAR NO DEFINIDO'"></span>
          <span class="text-slate-400 uppercase truncate w-full" x-text="item.banco || 'BANCO'"></span>
          <span class="text-cyan-400 font-bold w-full truncate" x-text="'Ref: ' + (item.referencia || 'N/A')"></span>
        </div>
      </div>

      <div class="bg-[#030611] rounded-xl border border-blue-900/50 p-2 space-y-1">
        <div class="grid grid-cols-12 items-center text-xs gap-1">
          <span class="col-span-4 font-black text-cyan-300 uppercase truncate text-[11px]" 
                x-text="(directorio.find(d => d.nombre === (item.nombre_socio_1 || item.socio_1))?.herencia ? '↳ ' : '') + (item.nombre_socio_1 || item.socio_1 || item.titular || 'GENERAL')"></span>
          <div class="col-span-3 text-center">
            <span class="px-1 py-0.5 rounded bg-purple-950/80 text-purple-300 text-[8px] md:text-[9px] font-mono border border-purple-500/30 whitespace-nowrap" x-text="'T1: ' + (item.tasa_1 || '1.00')"></span>
          </div>
          <span class="col-span-5 font-mono font-bold text-right truncate text-[11px]" 
                :class="parseFloat(item.monto_1 !== undefined && item.monto_1 !== null ? item.monto_1 : (item.m1_socio !== undefined ? item.m1_socio : item.monto)) < 0 ? 'text-rose-400' : 'text-emerald-400'" 
                x-text="formatMonto(item.monto_1 !== undefined && item.monto_1 !== null ? item.monto_1 : (item.m1_socio !== undefined ? item.m1_socio : item.monto)) + ' ' + (item.moneda_socio_1 || 'USDT')"></span>
        </div>
        
        <template x-if="item.nombre_socio_2 && item.nombre_socio_2 !== 'GENERAL'">
          <div class="grid grid-cols-12 items-center text-xs gap-1 border-t border-blue-900/40 pt-1">
            <span class="col-span-4 font-black text-pink-300 uppercase truncate text-[11px]" 
                  x-text="(directorio.find(d => d.nombre === (item.nombre_socio_2 || item.socio_2))?.herencia ? '↳ ' : '') + (item.nombre_socio_2 || item.socio_2)"></span>
            <div class="col-span-3 text-center">
              <span class="px-1 py-0.5 rounded bg-purple-950/80 text-purple-300 text-[8px] md:text-[9px] font-mono border border-purple-500/30 whitespace-nowrap" x-text="'T2: ' + (item.tasa_2 || '1.00')"></span>
            </div>
            <span class="col-span-5 font-mono font-bold text-right truncate text-[11px]" 
                  :class="parseFloat(item.monto_2 !== undefined && item.monto_2 !== null ? item.monto_2 : (item.m2_socio !== undefined ? item.m2_socio : 0)) < 0 ? 'text-rose-400' : 'text-emerald-400'" 
                  x-text="formatMonto(item.monto_2 !== undefined && item.monto_2 !== null ? item.monto_2 : (item.m2_socio !== undefined ? item.m2_socio : 0)) + ' ' + (item.moneda_socio_2 || 'USDT')"></span>
          </div>
        </template>
      </div>

      <!-- CONTENEDOR RE-AJUSTADO: IMAGEN FIJA A LA IZQUIERDA Y DATOS EXPANDIDOS A LA DERECHA -->
      <div class="flex items-stretch gap-2.5 h-44 sm:h-48">
        
        <!-- THUMBNAIL (ANCHO FIJO w-24 sm:w-28) -->
        <div class="w-24 sm:w-28 shrink-0 bg-[#010309] border border-blue-900/60 rounded-xl overflow-hidden p-1 flex items-center justify-center relative group">
          <button @click="verDetalleImagen(item)" class="w-full h-full flex items-center justify-center">
            <template x-if="item.url_r2 || item.url_imagen">
              <img :src="item.url_r2 || item.url_imagen" class="w-full h-full object-contain rounded-lg opacity-90 group-hover:opacity-100 transition-opacity" alt="Recibo">
            </template>
            <template x-if="!item.url_r2 && !item.url_imagen">
              <span class="text-[9px] text-slate-500 font-bold">SIN IMAGEN</span>
            </template>
          </button>
        </div>

        <!-- DATOS Y BOTONES (FLEX-1 EXPANDIDO) -->
        <div class="flex-1 min-w-0 flex flex-col justify-between gap-1 py-0.5">
          <span class="w-full text-center py-0.5 rounded bg-slate-800/90 text-slate-300 font-mono text-[9px] md:text-[10px] font-bold border border-slate-700 truncate px-1 shadow" 
                title="Hash" x-text="item.hash_corto || (item.hash_largo ? item.hash_largo.substring(0,8) : 'HASH')"></span>
          
          <div class="flex gap-1 w-full">
            <span class="flex-1 text-center py-0.5 rounded text-[9px] font-bold border whitespace-nowrap" 
                  :class="(item.tipo_op1 || item.tipo_op_socio || item.tipo_op || item.tipo_manual || 'D').startsWith('P') ? 'bg-amber-950 text-amber-300 border-amber-500/40' : ((item.tipo_op1 || item.tipo_op_socio || item.tipo_op || item.tipo_manual || 'D').startsWith('A') ? 'bg-purple-950 text-purple-300 border-purple-500/40' : 'bg-cyan-950 text-cyan-300 border-cyan-500/40')" 
                  x-text="(item.tipo_op1 || item.tipo_op_socio || item.tipo_op || item.tipo_manual || 'D').split('-')[0]"></span>
            <span x-show="item.nombre_socio_2 && item.nombre_socio_2 !== 'GENERAL'" class="flex-1 text-center py-0.5 rounded bg-amber-950 text-amber-300 text-[9px] font-bold border border-amber-500/40 whitespace-nowrap">x2</span>
          </div>

          <div class="flex gap-1 w-full">
            <span class="flex-1 text-center py-0.5 rounded bg-purple-950 text-purple-300 text-[8px] md:text-[9px] font-bold border border-purple-500/40 truncate px-0.5" 
                  x-text="item.lote_tasa_asignado || item.lote_tasa || loteActivo || 'T-ND'"></span>
            <span x-show="item.procesado_ia" class="flex-1 text-center py-0.5 rounded bg-emerald-950 text-emerald-300 text-[9px] font-bold border border-emerald-500/40 flex items-center justify-center whitespace-nowrap">✓ IA</span>
          </div>

          <div class="flex flex-col gap-0.5 mt-auto">
            <div class="w-full text-center py-0.5 rounded bg-slate-900/90 text-slate-200 font-mono text-[9px] md:text-[10px] font-bold border border-slate-700/60 shadow truncate px-0.5" 
                 x-text="'ME1:' + formatMonto(item.me1 !== undefined && item.me1 !== null ? item.me1 : (item.monto_1 || item.monto || 0))"></div>
            <template x-if="item.nombre_socio_2 && item.nombre_socio_2 !== 'GENERAL'">
              <div class="w-full text-center py-0.5 rounded bg-slate-900/90 text-slate-200 font-mono text-[9px] md:text-[10px] font-bold border border-slate-700/60 shadow truncate px-0.5" 
                   x-text="'ME2:' + formatMonto(item.me2 !== undefined && item.me2 !== null ? item.me2 : (item.monto_2 || 0))"></div>
            </template>
          </div>

          <div class="flex justify-around items-center pt-1 border-t border-blue-900/30">
            <button @click="eliminarComprobante(item.hash_largo)" class="p-1.5 text-slate-400 hover:text-rose-400 transition-colors text-base active:scale-95" title="Eliminar">🗑</button>
            <button @click="abrirModal(item)" class="p-1.5 text-slate-400 hover:text-cyan-400 transition-colors text-base active:scale-95" title="Auditar">✏</button>
          </div>
        </div>

      </div>
    </div>
  </template>
</div>
