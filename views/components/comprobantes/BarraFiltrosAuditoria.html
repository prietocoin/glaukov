<div class="bg-[#0b132b] border border-slate-800 rounded-lg p-3 flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-2 flex-1 min-w-[200px]">
    <span class="text-xs text-slate-400">Filtrar socio:</span>
    <input type="text" x-model="filtroSocio" @input.debounce.300ms="cargarComprobantes()" placeholder="Ej: Socio 01..." class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white w-full focus:outline-none focus:border-cyan-500">
  </div>
  <div class="flex items-center gap-2">
    <button @click="cargarComprobantes()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 rounded flex items-center gap-1">
      🔄 Actualizar
    </button>
  </div>
</div>
