<!-- ================================================================= -->
<!-- ARCHIVO: HeaderKPIs.html                                          -->
<!-- RESPONSABILIDAD: Título principal, botones globales y KPIs top   -->
<!-- LÍNEAS APROX: ~45 líneas                                         -->
<!-- ================================================================= -->

<div class="flex items-center justify-between gap-2">
  <div>
    <h2 class="text-lg md:text-2xl font-black text-white tracking-tight leading-tight">Auditoría en Vivo</h2>
    <p class="text-[10px] md:text-xs text-slate-400">Comprobantes procesados con IA y tasas dinámicas.</p>
  </div>
  <div class="flex items-center gap-1.5 shrink-0">
    <!-- Botón Refrescar Lista -->
    <button @click="cargarComprobantes(false)" class="p-2 bg-[#060c24] border border-blue-900/60 rounded-xl hover:bg-blue-900/40 text-slate-300 transition-colors active:scale-95" title="Refrescar">
      🔄
    </button>
    
    <!-- Botón Generador de Estado de Cuenta PDF / Evolution API -->
    <button @click.stop="$dispatch('abrir-reporte')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center gap-1.5 active:scale-95">
      📄 Reportes
    </button>

    <!-- Contador de ítems en pantalla -->
    <span class="px-2.5 py-1.5 bg-purple-950/80 border border-purple-500/40 text-purple-300 rounded-xl text-[11px] md:text-xs font-bold font-mono" x-text="comprobantes.length + ' ítems'"></span>
  </div>
</div>

<!-- GRILLA DE KPIS SUPERIORES (5 Tarjetas de Resumen Contable) -->
<div class="grid grid-cols-2 lg:grid-cols-5 gap-2 md:gap-3">
  
  <!-- 1. Sujeto Auditado -->
  <div class="col-span-2 sm:col-span-1 bg-[#060c24] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-blue-900/50 shadow-xl">
    <p class="text-[8px] md:text-[9px] font-extrabold text-blue-400/80 uppercase">SUJETO / ENTIDAD AUDITADA</p>
    <h3 class="text-xs md:text-base font-black text-white mt-0.5 truncate" x-text="sujetoAuditado"></h3>
  </div>

  <!-- 2. Ítems Operados -->
  <div class="bg-[#060c24] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-blue-900/50 shadow-xl">
    <p class="text-[8px] md:text-[9px] font-extrabold text-blue-400/80 uppercase">OPERADOS</p>
    <h3 class="text-xs md:text-base font-black text-pink-400 mt-0.5" x-text="comprobantes.length + ' ítems'"></h3>
  </div>

  <!-- 3. Saldo Anterior editable -->
  <div class="bg-[#060c24] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-amber-500/30 shadow-xl flex items-center gap-1.5">
    <div class="flex-1 min-w-0">
      <p class="text-[8px] md:text-[9px] font-extrabold text-amber-400 uppercase truncate">SALDO ANTERIOR</p>
      <input type="number" x-model="saldoAnterior" class="w-full bg-[#030611] border border-amber-500/40 rounded-lg px-1.5 py-0.5 text-xs md:text-sm font-bold text-amber-300 mt-0.5 outline-none">
    </div>
    <span class="text-[10px] font-bold text-amber-500 mt-3 shrink-0" x-text="(directorio.find(d => (d.nombre || '').trim().toUpperCase() === (filtroSocio || sujetoAuditado || '').trim().toUpperCase())?.moneda_base || comprobantes[0]?.moneda_socio_1 || 'USDT').toUpperCase()"></span>
  </div>

  <!-- 4. Total Movimiento del Período -->
  <div class="bg-[#060c24] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-blue-900/50 shadow-xl col-span-1">
    <p class="text-[8px] md:text-[9px] font-extrabold text-emerald-400 uppercase">MOVIMIENTO</p>
    <h3 class="text-xs md:text-base font-black text-emerald-400 mt-0.5 truncate" x-text="formatMonto(movimientoFiltradoTotal) + ' ' + (directorio.find(d => (d.nombre || '').trim().toUpperCase() === (filtroSocio || sujetoAuditado || '').trim().toUpperCase())?.moneda_base || comprobantes[0]?.moneda_socio_1 || 'USDT').toUpperCase()"></h3>
  </div>

  <!-- 5. Saldo Actual Calculado -->
  <div class="bg-[#010a14] p-2.5 md:p-3.5 rounded-xl md:rounded-2xl border border-emerald-500/40 shadow-xl col-span-2 sm:col-span-1">
    <p class="text-[8px] md:text-[9px] font-extrabold text-emerald-400 uppercase">SALDO ACTUAL TOTAL</p>
    <h3 class="text-xs md:text-base font-black text-emerald-300 mt-0.5 truncate" x-text="formatMonto(saldoActualTotal) + ' ' + (directorio.find(d => (d.nombre || '').trim().toUpperCase() === (filtroSocio || sujetoAuditado || '').trim().toUpperCase())?.moneda_base || comprobantes[0]?.moneda_socio_1 || 'USDT').toUpperCase()"></h3>
  </div>

</div>
