<div class="space-y-4">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-blue-900/50 pb-3">
    <div>
      <h2 class="text-xl md:text-2xl font-black text-white tracking-tight">Directorio de Socios</h2>
    </div>

    <div class="flex items-center gap-1.5 flex-wrap w-full sm:w-auto">
      <button @click="abrirConfigSocio({ nombre: 'GENERAL', rol: 'MATRIZ_GENERAL' })" class="px-2.5 py-1.5 bg-amber-950/80 border border-amber-500/50 text-amber-300 rounded-lg text-[10px] md:text-xs font-bold">🌐 General</button>
      <button @click="apagarTodosSocios()" class="px-2.5 py-1.5 bg-rose-950/80 border border-rose-500/50 text-rose-300 rounded-lg text-[10px] md:text-xs font-bold">🔴 Apagar Todos</button>
      <button @click="guardarVigentes()" class="px-2.5 py-1.5 bg-purple-950/80 border border-purple-500/50 text-purple-300 rounded-lg text-[10px] md:text-xs font-bold">📌 Guardar</button>
      <button @click="restaurarVigentes()" class="px-2.5 py-1.5 bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 rounded-lg text-[10px] md:text-xs font-bold">📄 Restaurar</button>
      <button @click="crearNuevoSocio()" class="px-3 py-1.5 bg-cyan-600 text-white rounded-lg text-xs font-black hover:bg-cyan-500 shadow-lg shadow-cyan-600/20">➕ Nuevo</button>
    </div>
  </div>

  <div class="bg-[#060c24] p-2.5 rounded-2xl border border-blue-900/50 shadow-xl">
    <input type="text" x-model="busquedaDirectorio" placeholder="Buscar socio..." class="w-full bg-[#030611] border border-blue-900/60 rounded-xl px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-cyan-400">
  </div>

  <div class="bg-[#060c24] rounded-2xl border border-blue-900/50 shadow-2xl overflow-hidden">
    <div class="divide-y divide-blue-900/40">
      <template x-for="socio in directorioFiltrado" :key="socio.nombre">
        <div class="p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 hover:bg-blue-950/20 transition-colors">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <h3 class="font-extrabold text-white text-sm" x-text="socio.nombre"></h3>
              
              <button @click="toggleEstadoSocio(socio)" 
                      :class="socio.activo ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-slate-800 text-slate-500 border-slate-700'"
                      class="px-2 py-0.5 rounded-lg text-[9px] font-black border transition-all flex items-center gap-1"
                      title="Estado de envío de tasas por WhatsApp">
                <span class="w-1.5 h-1.5 rounded-full" :class="socio.activo ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'"></span>
                <span x-text="socio.activo ? 'WA: ACTIVO' : 'WA: INACTIVO'"></span>
              </button>

              <button @click="toggleDashSocio(socio)" 
                      :class="socio.mostrar_dashboard !== false ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/50' : 'bg-slate-800 text-slate-500 border-slate-700'"
                      class="px-2 py-0.5 rounded-lg text-[9px] font-black border transition-all flex items-center gap-1"
                      title="Activar o desactivar presencia de tarjeta en el Dashboard">
                📊 <span x-text="socio.mostrar_dashboard !== false ? 'DASH: ON' : 'DASH: OFF'"></span>
              </button>

              <button @click="toggleHerenciaSocio(socio)" 
                      :class="socio.herencia ? 'bg-purple-500/20 text-purple-300 border-purple-500/50' : 'bg-slate-800 text-slate-500 border-slate-700'"
                      class="px-2 py-0.5 rounded-lg text-[9px] font-black border transition-all flex items-center gap-1"
                      title="Heredar contrato y spreads de FUNDDA">
                🧬 <span x-text="socio.herencia ? 'HERENCIA: ON' : 'HERENCIA: OFF'"></span>
              </button>
            </div>

            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="px-1.5 py-0.5 rounded bg-blue-950 text-cyan-300 text-[8px] md:text-[9px] font-bold border border-blue-800/40" x-text="socio.rol || socio.roles || 'SOCIO'"></span>
              <span class="px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 text-[8px] md:text-[9px] font-bold border border-emerald-800/40" x-text="socio.moneda_base || socio.moneda_socio || 'USDT'"></span>
              <span class="px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold border" :class="getTallaClass(socio).color" x-text="getTallaClass(socio).label"></span>
              <span class="font-mono text-slate-400 text-[10px] ml-1" x-text="socio.id_grupo || socio.whatsapp || '-'"></span>
            </div>
          </div>

          <div class="flex items-center justify-end gap-2 shrink-0 border-t sm:border-t-0 border-blue-900/30 pt-2 sm:pt-0">
            <button @click="enviarTasaIndividual(socio)" class="p-1.5 bg-amber-950/80 border border-amber-600/40 text-amber-300 rounded-xl hover:bg-amber-900 transition-all active:scale-95 shadow-lg shadow-amber-900/20" title="Enviar Tasa por WhatsApp">⚡</button>
            <button @click="abrirConfigSocio(socio)" class="px-3 py-1.5 bg-purple-950/80 border border-purple-600/40 text-purple-300 rounded-xl font-bold text-xs hover:bg-purple-900 transition-all flex-1 sm:flex-none text-center active:scale-95">⚙ Configurar</button>
            <button @click="eliminarSocioDirectorio(socio.nombre)" class="p-1.5 bg-rose-950/80 border border-rose-600/40 text-rose-300 rounded-xl hover:bg-rose-900 transition-all active:scale-95" title="Eliminar Socio">🗑</button>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
