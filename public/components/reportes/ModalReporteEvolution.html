<!-- MODAL: GENERADOR DE REPORTE/ESTADO DE CUENTA EN IMAGEN -->
<div x-data="{ modalReporteAbierto: false, generandoImagen: false, paginaActual: 1, filtroSocio: '' }"
     x-show="modalReporteAbierto"
     @abrir-reporte.window="modalReporteAbierto = true; paginaActual = 1; if ($event.detail?.socio) filtroSocio = $event.detail.socio;"
     class="fixed inset-0 z-50 flex items-center justify-center p-1 sm:p-3 md:p-6 bg-black/85 backdrop-blur-md"
     x-cloak>
  <div class="bg-[#060c24] border border-blue-900/80 rounded-2xl w-full max-w-4xl flex flex-col shadow-2xl relative overflow-hidden" @click.away="modalReporteAbierto = false">
    <div class="flex items-center justify-between bg-[#080e26] border-b border-blue-900/60 px-3 py-2.5 shrink-0">
      <span class="font-black text-cyan-300 text-xs sm:text-sm">📄 Estado de Cuenta</span>
      <div class="flex items-center gap-1.5">
        <button type="button" @click="enviarReporteViaEvolution()" :disabled="generandoImagen" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-black shadow-lg">
          <span x-show="!generandoImagen" x-text="'🤖 Enviar Pág ' + paginaActual"></span>
          <span x-show="generandoImagen">⏳ Enviando...</span>
        </button>
        <button type="button" @click="modalReporteAbierto = false" class="px-2.5 py-1.5 bg-blue-950 text-slate-300 rounded-xl text-xs font-bold border border-blue-900">✕</button>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-4 flex justify-center bg-[#030611]">
      <div id="reporte-html-documento" class="bg-white text-slate-900 p-6 rounded-xl shadow-2xl w-[800px] min-h-[1000px] flex flex-col justify-between">
        <div>
          <div class="border-b-2 border-slate-900 pb-3 mb-4 flex justify-between items-center">
            <h1 class="text-lg font-black uppercase text-slate-900">REPORTE DE ESTADO DE CUENTA</h1>
            <span class="text-xs font-black text-emerald-600 font-mono">FUNDABLOCK GLAUKOV ENGINE</span>
          </div>
          <!-- 🟢 Lectura segura que no romperá Alpine -->
          <p class="text-xs text-slate-500 font-bold mb-4" x-text="'Socio Auditado: ' + (filtroSocio || 'TODOS')"></p>
        </div>
        <div class="border-t-2 border-slate-900 pt-2 text-[10px] text-slate-500 flex justify-between font-mono">
          <span>GLAUKOV ENGINE • ATENEA V2.0 • AUDITORÍA EN TIEMPO REAL</span>
          <span>DOCUMENTO OFICIAL</span>
        </div>
      </div>
    </div>
  </div>
</div>
