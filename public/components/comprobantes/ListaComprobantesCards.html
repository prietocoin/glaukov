<!-- GRID DE TARJETAS DE COMPROBANTES AUDITADOS -->
<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-3 md:gap-5">
  <template x-for="item in comprobantes" :key="item.hash_largo">
    <div class="bg-[#060c24] border border-[#16224f] hover:border-cyan-500/40 rounded-2xl p-3 md:p-4 shadow-xl flex flex-col justify-between gap-2.5 transition-all relative">
      <div class="flex items-start justify-between gap-2 border-b border-blue-900/30 pb-2">
        <div class="flex items-baseline gap-1 min-w-0">
          <span class="text-xl sm:text-2xl font-black tracking-tight truncate" :class="parseFloat(item.monto || item.monto_local) < 0 ? 'text-rose-400' : 'text-emerald-400'" x-text="formatMonto(item.monto || item.monto_local)"></span>
          <span class="text-xs font-black text-slate-300 whitespace-nowrap" x-text="item.moneda || item.moneda_local || 'PEN'"></span>
        </div>
        <div class="flex flex-col items-end text-right text-[9px] md:text-[10px] font-mono leading-tight max-w-[130px] shrink-0">
          <span class="text-slate-200 font-bold uppercase truncate w-full" x-text="item.titular || 'TITULAR NO DEFINIDO'"></span>
          <span class="text-slate-400 uppercase truncate w-full" x-text="item.banco || 'BANCO'"></span>
          <span class="text-cyan-400 font-bold w-full truncate" x-text="'Ref: ' + (item.referencia || 'N/A')"></span>
        </div>
      </div>

      <div class="bg-[#030611] rounded-xl border border-blue-900/50 p-2 space-y-1">
        <div class="grid grid-cols-12 items-center text-xs gap-1">
          <span class="col-span-4 font-black text-cyan-300 uppercase truncate text-[11px]" x-text="(directorio.find(d => d.nombre === (item.nombre_socio_1 || item.socio_1))?.herencia ? '↳ ' : '') + (item.nombre_socio_1 || item.socio_1 || item.titular || 'GENERAL')"></span>
          <div class="col-span-3 text-center">
            <span class="px-1 py-0.5 rounded bg-purple-950/80 text-purple-300 text-[8px] md:text-[9px] font-mono border border-purple-500/30 whitespace-nowrap" x-text="'T1: ' + (item.tasa_1 || '1.00')"></span>
          </div>
          <span class="col-span-5 font-mono font-bold text-right truncate text-[11px]" :class="parseFloat(item.monto_1 ?? item.m1_socio ?? item.monto) < 0 ? 'text-rose-400' : 'text-emerald-400'" x-text="formatMonto(item.monto_1 ?? item.m1_socio ?? item.monto) + ' ' + (item.moneda_socio_1 || 'USDT')"></span>
        </div>
        <template x-if="item.nombre_socio_2 && item.nombre_socio_2 !== 'GENERAL'">
          <div class="grid grid-cols-12 items-center text-xs gap-1 border-t border-blue-900/40 pt-1">
            <span class="col-span-4 font-black text-pink-300 uppercase truncate text-[11px]" x-text="(directorio.find(d => d.nombre === (item.nombre_socio_2 || item.socio_2))?.herencia ? '↳ ' : '') + (item.nombre_socio_2 || item.socio_2)"></span>
            <div class="col-span-3 text-center">
              <span class="px-1 py-0.5 rounded bg-purple-950/80 text-purple-300 text-[8px] md:text-[9px] font-mono border border-purple-500/30 whitespace-nowrap" x-text="'T2: ' + (item.tasa_2 || '1.00')"></span>
            </div>
            <span class="col-span-5 font-mono font-bold text-right truncate text-[11px]" :class="parseFloat(item.monto_2 ?? item.m2_socio ?? 0) < 0 ? 'text-rose-400' : 'text-emerald-400'" x-text="formatMonto(item.monto_2 ?? item.m2_socio ?? 0) + ' ' + (item.moneda_socio_2 || 'USDT')"></span>
          </div>
        </template>
      </div>

      <div class="flex items-stretch gap-2.5 h-44 sm:h-48">
        <div class="flex-1 bg-[#010309] border border-blue-900/60 rounded-xl overflow-hidden p-1 flex items-center justify-center relative group min-w-0">
          <button @click="verDetalleImagen(item)" class="w-full h-full flex items-center justify-center">
            <template x-if="item.url_r2 || item.url_imagen">
              <img :src="item.url_r2 || item.url_imagen" class="w-full h-full object-contain rounded-lg opacity-90 group-hover:opacity-100 transition-opacity" alt="Recibo">
            </template>
            <template x-if="!item.url_r2 && !item.url_imagen">
              <span class="text-[9px] text-slate-500 font-bold">SIN IMAGEN</span>
            </template>
          </button>
        </div>
        <div class="w-24 md:w-28 shrink-0 flex flex-col justify-between gap-1 py-0.5">
          <span class="w-full text-center py-0.5 rounded bg-slate-800/90 text-slate-300 font-mono text-[9px] md:text-[10px] font-bold border border-slate-700 truncate px-1 shadow" title="Hash" x-text="item.hash_corto || (item.hash_largo ? item.hash_largo.substring(0,8) : 'HASH')"></span>
          <div class="flex gap-1 w-full">
            <span class="flex-1 text-center py-0.5 rounded text-[9px] font-bold border whitespace-nowrap" :class="(item.tipo_op1 || item.tipo_op_socio || item.tipo_op || item.tipo_manual || 'D').startsWith('P') ? 'bg-amber-950 text-amber-300 border-amber-500/40' : ((item.tipo_op1 || item.tipo_op_socio || item.tipo_op || item.tipo_manual || 'D').startsWith('A') ? 'bg-purple-950 text-purple-300 border-purple-500/40' : 'bg-cyan-950 text-cyan-300 border-cyan-500/40')" x-text="(item.tipo_op1 || item.tipo_op_socio || item.tipo_op || item.tipo_manual || 'D').split('-')[0]"></span>
            <span x-show="item.nombre_socio_2 && item.nombre_socio_2 !== 'GENERAL'" class="flex-1 text-center py-0.5 rounded bg-amber-950 text-amber-300 text-[9px] font-bold border border-amber-500/40 whitespace-nowrap">x2</span>
          </div>
          <div class="flex justify-around items-center pt-1 border-t border-blue-900/30">
            <button @click="eliminarComprobante(item.hash_largo)" class="p-1.5 text-slate-400 hover:text-rose-400 transition-colors text-base active:scale-95" title="Eliminar">🗑</button>
            <button @click="abrirModal(item)" class="p-1.5 text-slate-400 hover:text-cyan-400 transition-colors text-base active:scale-95" title="Auditar">✏</button>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
