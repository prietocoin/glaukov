<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glaukov Engine - Atenea</title>
  <link rel="icon" type="image/png" href="/logo-fundablock.png">
  
  <script type="module" src="/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-[#0b0d19] text-slate-200 min-h-screen" x-data="app()">

  <div class="flex flex-col md:flex-row min-h-screen">
    
    <!-- BARRA LATERAL -->
    <aside class="w-full md:w-64 bg-[#101221] border-r border-slate-800 p-4 space-y-4">
      <div class="font-extrabold text-white text-base">FUNDABLOCK</div>
      <nav class="space-y-1">
        <button @click="vistaActiva = 'comprobantes'" 
                :class="vistaActiva === 'comprobantes' ? 'bg-purple-600/30 text-purple-300' : 'text-slate-400'" 
                class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold transition-all">
          📄 Comprobantes
        </button>
        <button @click="vistaActiva = 'directorio'" 
                :class="vistaActiva === 'directorio' ? 'bg-purple-600/30 text-purple-300' : 'text-slate-400'" 
                class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold transition-all">
          👥 Directorio Socios
        </button>
      </nav>
    </aside>

    <!-- CONTENIDO -->
    <main class="flex-1 p-6">
      
      <!-- COMPONENTE: COMPROBANTES -->
      <template x-if="vistaActiva === 'comprobantes'">
        <div class="space-y-4" x-data="comprobantes">
          <div class="flex justify-between items-center">
            <h2 class="text-lg font-bold text-white">Comprobantes Raw</h2>
            <button @click="cargar()" class="px-3 py-1 bg-purple-600 text-white rounded-xl text-xs font-bold">🔄 Actualizar</button>
          </div>

          <div class="bg-[#131525] rounded-xl border border-slate-800 overflow-hidden">
            <table class="w-full text-xs text-left">
              <thead class="bg-[#171a2e] text-slate-400 font-bold">
                <tr>
                  <th class="p-3">HASH</th>
                  <th class="p-3">FECHA</th>
                  <th class="p-3">MONTO</th>
                  <th class="p-3">TITULAR</th>
                  <th class="p-3">SOCIO</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
                <template x-for="item in items" :key="item.hash_largo">
                  <tr class="hover:bg-slate-800/30">
                    <td class="p-3 font-mono text-purple-300 font-bold" x-text="item.hash_corto"></td>
                    <td class="p-3 text-slate-400" x-text="formatearFecha(item.fecha_hora_comprobante)"></td>
                    <td class="p-3 text-emerald-400 font-bold" x-text="item.monto + ' ' + item.moneda"></td>
                    <td class="p-3 text-white uppercase" x-text="item.titular"></td>
                    <td class="p-3 text-purple-300 font-bold" x-text="item.nombre_socio_1"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- COMPONENTE: DIRECTORIO -->
      <template x-if="vistaActiva === 'directorio'">
        <div class="space-y-4" x-data="directorio">
          <h2 class="text-lg font-bold text-white">Directorio de Socios</h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <template x-for="s in filtrados" :key="s.nombre">
              <div class="bg-[#131525] p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                <div>
                  <h3 class="font-bold text-white" x-text="s.nombre"></h3>
                  <p class="text-[10px] text-slate-400" x-text="s.roles"></p>
                </div>
                <button @click="toggleEstado(s)" 
                        :class="s.activo ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'" 
                        class="px-2 py-1 rounded text-[10px] font-bold" 
                        x-text="s.activo ? 'ACTIVO' : 'INACTIVO'">
                </button>
              </div>
            </template>
          </div>
        </div>
      </template>

    </main>
  </div>
</body>
</html>
