<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fundablock - Glaukov Engine Atenea V2.0</title>

  <!-- PWA & Assets -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030611">
  <link rel="icon" type="image/png" href="/logo-fundablock.png">

  <!-- Tailwind CSS & Estilos Globales -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #030611; }
    ::-webkit-scrollbar-thumb { background: #16224f; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2563eb; }
    input, select, textarea { font-size: 14px !important; }
  </style>

  <!-- Librerías, Component Loader & Micro-módulos JS -->
  <script src="/js/utils/formatters.js"></script>
  <script src="/js/api.js?v=2.0"></script>
  <script type="module" src="/js/utils/componentLoader.js"></script>
  <script type="module" src="/js/appBootstrap.js?v=3.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-[#030611] text-slate-100 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-black" x-data="app" x-cloak>

  <div class="flex flex-col md:flex-row min-h-screen">
    <!-- Sidebar Navegación -->
    <div x-include="/components/layout/Sidebar.html"></div>

    <!-- Área Principal de Vistas -->
    <main class="flex-1 p-3 md:p-6 overflow-x-hidden space-y-4 md:space-y-5">
      <!-- VISTA 0: DASHBOARD -->
      <div x-show="vistaActiva === 'dashboard'" class="space-y-4">
        <div x-include="/components/dashboard/BalancePendientes.html"></div>
        <div x-include="/components/dashboard/InspeccionLotes.html"></div>
      </div>

      <!-- VISTA 1: COMPROBANTES -->
      <div x-show="vistaActiva === 'comprobantes'" class="space-y-3 md:space-y-4">
        <div x-include="/components/comprobantes/BarraFiltrosAuditoria.html"></div>
        <div x-include="/components/comprobantes/ListaComprobantesCards.html"></div>
      </div>

      <!-- VISTA 2: CARTELERA DE TASAS -->
      <div x-show="vistaActiva === 'cartelera'" x-include="/components/tasas/VistaTasas.html"></div>

      <!-- VISTA 3: DIRECTORIO -->
      <div x-show="vistaActiva === 'directorio'" x-include="/components/directorio/VistaDirectorio.html"></div>
    </main>
  </div>

  <!-- Puntos de Montaje de Modales Aislados -->
  <div x-include="/components/directorio/ModalConfigSocio.html"></div>
  <div x-include="/components/comprobantes/ModalEditarComprobante.html"></div>
  <div x-include="/components/reportes/ModalReporteEvolution.html"></div>
  <div x-include="/components/comprobantes/ModalVisorImagen.html"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('Error PWA Service Worker:', err);
        });
      });
    }
  </script>
</body>
</html>
